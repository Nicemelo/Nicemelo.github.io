<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание 8 — Обратная связь</title>
  <script src="script.js" defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #e0e0e0 0%, #f5f5f5 100%);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* === Основной контент === */
    .main-content {
      text-align: center;
      background: #fff;
      padding: 50px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 500px;
      width: 100%;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 { margin-bottom: 20px; font-size: 28px; color: #2b2b2b; }
    .description { margin-bottom: 30px; color: #666; font-size: 16px; line-height: 1.5; }

    /* Кнопка открытия */
    .btn-primary {
      padding: 14px 32px;
      background: #28a745;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      background: #218838;
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
    }

    /* === Попап === */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(40, 40, 40, 0.6);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.hidden { display: none; opacity: 0; }

    .modal-window {
      background: #fff;
      width: 100%;
      max-width: 480px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      position: relative;
      max-height: 100%;
      overflow-y: auto;
      animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes slideDown {
      from { transform: translateY(50px) scale(0.9); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .modal-close {
      position: absolute; top: 15px; right: 20px;
      background: none; border: none; font-size: 30px;
      cursor: pointer; color: #aaa;
      transition: transform 0.3s ease, color 0.3s ease;
    }
    .modal-close:hover { color: #333; transform: rotate(90deg); }
    .modal-title { margin-bottom: 25px; font-size: 22px; text-align: center; color: #2b2b2b; }

    /* === Форма === */
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; margin-bottom: 6px; font-weight: 600;
      font-size: 13px; color: #555; text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Автоматическая заглавная буква (делает CSS) */
    #fio { text-transform: capitalize; }

    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="tel"],
    .form-group textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background: #fafafa;
      font-family: inherit;
      font-size: 15px;
      color: #333;
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #888;
      outline: none;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(136, 136, 136, 0.15);
    }

    /* Подсветка правильного/неправильного ввода */
    .input-valid { border-color: #28a745 !important; background-color: #f4fff6 !important; }
    .input-invalid { border-color: #d9534f !important; background-color: #fff6f6 !important; }

    .error-msg {
      color: #d9534f; font-size: 12px; margin-top: 5px;
      min-height: 14px; font-weight: 500;
    }

    .checkbox-group {
      display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px;
    }
    .checkbox-group input[type="checkbox"] {
      margin-top: 4px; accent-color: #28a745; cursor: pointer;
    }
    .checkbox-group label {
      font-weight: normal; font-size: 13px; color: #666;
      line-height: 1.4; cursor: pointer;
    }

    .form-status {
      margin: 15px 0; font-size: 14px; font-weight: 600;
      text-align: center; min-height: 20px;
    }
    .form-status.success { color: #28a745; }
    .form-status.error { color: #d9534f; }

    /* Кнопка отправки */
    .btn-submit {
      width: 100%; padding: 14px;
      background: #28a745; color: #fff;
      border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
      transition: all 0.3s ease;
    }
    .btn-submit:hover:not(:disabled) {
      background: #218838; transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
    }

    /* Стиль для ЗАБЛОКИРОВАННОЙ кнопки */
    .btn-submit:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
      color: #666;
    }

        /* === Мобильная адаптивность === */
        @media (max-width: 600px) {
      .main-content { padding: 30px 20px; }
      
      /* Форма прижимается к низу и не скроллится */
      .modal-overlay { 
        padding: 0; 
        align-items: flex-end; 
      }
      
      .modal-window {
        border-radius: 16px 16px 0 0;
        /* Убираем прокрутку, сжимая контент */
        max-height: none; 
        overflow-y: visible;
        padding: 20px 15px;
        animation: slideUpMobile 0.3s ease;
      }

      /* Уменьшаем отступы полей, чтобы всё влезло */
      .form-group { margin-bottom: 10px; }
      .form-group label { font-size: 11px; margin-bottom: 3px; }
      .form-group input, 
      .form-group textarea { 
        padding: 8px 10px; 
        font-size: 14px; 
      }
      .form-group textarea { height: 60px; min-height: 60px; }
      
      /* Уменьшаем заголовок и чекбокс */
      .modal-title { margin-bottom: 15px; font-size: 18px; }
      .checkbox-group { margin-bottom: 12px; }
      .checkbox-group label { font-size: 11px; }
      .btn-submit { padding: 12px; font-size: 15px; }
    }
  </style>
</head>
<body>

  <main class="main-content">
    <h1>Связь со мной</h1>
    <p class="description">Есть вопросы? Оставьте заявку, и я обязательно увижу и возможно свяжусь с вами в ближайшее время.</p>
    <button id="openModalBtn" class="btn-primary">Написать мне</button>
  </main>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-window">
      <button id="closeModalBtn" class="modal-close" aria-label="Закрыть">&times;</button>
      
      <h2 class="modal-title">Обратная связь</h2>
      
      <form id="contactForm" novalidate>
        
        <div class="form-group">
          <label for="fio">ФИО</label>
          <!-- Добавлен maxlength -->
          <input type="text" id="fio" name="fio" placeholder="Иванов Иван Иванович" maxlength="50" required>
          <div class="error-msg" id="error-fio"></div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="example@mail.ru" maxlength="50" required>
          <div class="error-msg" id="error-email"></div>
        </div>

        <div class="form-group">
          <label for="phone">Телефон</label>
          <input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67" maxlength="20" required>
          <div class="error-msg" id="error-phone"></div>
        </div>

        <div class="form-group">
          <label for="org">Организация</label>
          <input type="text" id="org" name="org" placeholder="ООО Ромашка" maxlength="60">
        </div>

        <div class="form-group">
          <label for="message">Сообщение</label>
          <textarea id="message" name="message" rows="3" placeholder="Ваше сообщение..." maxlength="500" required></textarea>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="policy" name="policy" required>
          <label for="policy">Я согласен с политикой обработки персональных данных</label>
        </div>

        <div id="formStatus" class="form-status"></div>

        <!-- Кнопка по умолчанию disabled -->
        <button type="submit" id="submitBtn" class="btn-submit" disabled>Отправить сообщение</button>
      </form>
    </div>
  </div>

</body>
</html>
